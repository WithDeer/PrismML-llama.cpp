      # ============================================================
      # 3. Install HIP SDK Silently (using official -install flag)
      # ============================================================
      - name: Install HIP SDK Silently
        shell: powershell
        timeout-minutes: 30
        run: |
          $installer = "$env:TEMP\HIP-SDK.exe"
          $logFile = "$env:TEMP\hip-install.log"

          Write-Host "Starting silent HIP SDK installation..."
          # 使用官方 -install 参数，并记录日志
          $proc = Start-Process -FilePath $installer `
            -ArgumentList "-install", "-log", $logFile `
            -NoNewWindow -PassThru

          $completed = $proc.WaitForExit(1500000) # 25分钟超时
          if (-not $completed) {
            Write-Error "HIP SDK installation timed out after 25 minutes. Killing process."
            $proc.Kill()
            exit 1
          }

          Write-Host "Installation process exited with code: $($proc.ExitCode)"
          if (Test-Path $logFile) {
            Write-Host "--- Installation Log (tail) ---"
            Get-Content $logFile -Tail 50
          }

          if ($proc.ExitCode -ne 0) {
            Write-Error "HIP SDK installation failed with exit code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "HIP SDK installation completed successfully."
