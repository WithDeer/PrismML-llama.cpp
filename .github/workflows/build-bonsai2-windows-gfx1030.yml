name: Build Bonsai2 MTP for Windows gfx1030

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Install Ninja
        shell: powershell
        run: |
          choco install ninja -y
          refreshenv
          ninja --version

      - name: Cache HIP SDK
        uses: actions/cache@v4
        id: cache-hip
        with:
          path: C:\Program Files\AMD\ROCm
          key: hip-sdk-7.2-${{ runner.os }}-v6
          restore-keys: |
            hip-sdk-7.2-${{ runner.os }}-

      - name: Download HIP SDK
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: powershell
        timeout-minutes: 30
        run: |
          $url = "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-26.Q3-Win11-For-HIP.exe"
          $outFile = "$env:TEMP\HIP-SDK.exe"
          curl.exe -L --fail --retry 3 --retry-delay 5 -o "$outFile" "$url"
          $size = (Get-Item $outFile).Length
          if ($size -lt 100MB) { Write-Error "HIP SDK download incomplete."; exit 1 }

      - name: Install HIP SDK Silently
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: powershell
        timeout-minutes: 30
        run: |
          $installer = "$env:TEMP\HIP-SDK.exe"
          $logFile = "$env:TEMP\hip-install.log"
          $proc = Start-Process -FilePath $installer -ArgumentList "-install", "-log", $logFile -NoNewWindow -PassThru
          $completed = $proc.WaitForExit(1500000)
          if (-not $completed) { $proc.Kill(); exit 1 }
          if (Test-Path $logFile) { Get-Content $logFile -Tail 10 }

          $rocmBase = "C:\Program Files\AMD\ROCm"
          $hipPath = Get-ChildItem $rocmBase -Directory -ErrorAction SilentlyContinue |
                     Sort-Object Name -Descending | Select-Object -First 1
          $hipPath = $hipPath.FullName
          $clang = Get-ChildItem -Path $hipPath -Recurse -Filter "clang.exe" -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          echo "HIP_PATH=$hipPath" >> $env:GITHUB_ENV
          echo "HIP_BIN=$($clang.Directory.FullName)" >> $env:GITHUB_ENV
          echo "$($clang.Directory.FullName)" >> $env:GITHUB_PATH

      - name: Set HIP Environment
        shell: powershell
        run: |
          if (-not $env:HIP_PATH) {
            $rocmBase = "C:\Program Files\AMD\ROCm"
            $hipPath = Get-ChildItem $rocmBase -Directory -ErrorAction SilentlyContinue |
                       Sort-Object Name -Descending | Select-Object -First 1
            $hipPath = $hipPath.FullName
            $clang = Get-ChildItem -Path $hipPath -Recurse -Filter "clang.exe" -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            $hipBin = $clang.Directory.FullName
            echo "HIP_PATH=$hipPath" >> $env:GITHUB_ENV
            echo "HIP_BIN=$hipBin" >> $env:GITHUB_ENV
            echo "$hipBin" >> $env:GITHUB_PATH
          }
          Write-Host "HIP_PATH = $env:HIP_PATH"
          Write-Host "HIP_BIN  = $env:HIP_BIN"

      # ============================================================
      # Patch clang HIP math headers (v2)
      # 1. 恢复 __clang_hip_cmath.h 的包含（设备端需要）
      # 2. 注释掉 __clang_cuda_math_forward_declares.h（避免 __device__ 纯声明与 MSVC 冲突）
      # 3. 给 __clang_cuda_complex_builtins.h 改用 __builtin_*
      # ============================================================
      - name: Patch clang HIP math headers
        shell: powershell
        run: |
          $hipPath = $env:HIP_PATH

          # --- Locate the header directory ---
          $wrapper = Get-ChildItem -Path $hipPath -Recurse -Filter "__clang_hip_runtime_wrapper.h" -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if (-not $wrapper) { Write-Error "__clang_hip_runtime_wrapper.h not found"; exit 1 }
          $headerDir = $wrapper.Directory.FullName
          $wrapperPath = $wrapper.FullName
          Write-Host "Header dir: $headerDir"

          # =========================================================
          # Step 1: Patch __clang_hip_runtime_wrapper.h
          # =========================================================
          $wrapperContent = Get-Content $wrapperPath -Raw
          if ($wrapperContent -notmatch "PATCHED_V2") {
            Copy-Item $wrapperPath "$wrapperPath.bak" -Force
            $lines = Get-Content $wrapperPath
            $newLines = @()
            $newLines += "// PATCHED_V2"
            foreach ($line in $lines) {
              if ($line -match '^\s*#include\s*<__clang_cuda_math_forward_declares\.h>') {
                $newLines += "// PATCHED_V2: $line"
              } elseif ($line -match '^\s*#include\s*<__clang_hip_cmath\.h>') {
                # 恢复 __clang_hip_cmath.h（设备端需要）
                $newLines += $line
              } else {
                $newLines += $line
              }
            }
            $newLines | Set-Content -Path $wrapperPath -Encoding UTF8
            Write-Host "Patched __clang_hip_runtime_wrapper.h"
          } else {
            Write-Host "__clang_hip_runtime_wrapper.h already patched"
          }

          # =========================================================
          # Step 2: Patch __clang_cuda_complex_builtins.h
          # =========================================================
          $complexHeader = Join-Path $headerDir "__clang_cuda_complex_builtins.h"
          if (Test-Path $complexHeader) {
            $content = Get-Content $complexHeader -Raw
            if ($content -notmatch "PATCHED_V2") {
              Copy-Item $complexHeader "$complexHeader.bak" -Force
              $content = $content -replace '#define _ISNANd std::isnan', '#define _ISNANd __builtin_isnan // PATCHED_V2'
              $content = $content -replace '#define _ISINFd std::isinf', '#define _ISINFd __builtin_isinf // PATCHED_V2'
              $content = $content -replace '#define _COPYSIGNd std::copysign', '#define _COPYSIGNd __builtin_copysign // PATCHED_V2'
              Set-Content -Path $complexHeader -Value $content -Encoding UTF8
              Write-Host "Patched __clang_cuda_complex_builtins.h"
            } else {
              Write-Host "__clang_cuda_complex_builtins.h already patched"
            }
          } else {
            Write-Warning "__clang_cuda_complex_builtins.h not found"
          }

          # =========================================================
          # Step 3: Verify
          # =========================================================
          $verifyWrapper = Get-Content $wrapperPath -Raw
          $remainingForward = ([regex]::Matches($verifyWrapper, '^\s*#include\s*<__clang_cuda_math_forward_declares\.h>', 'Multiline')).Count
          $hasCmath = ($verifyWrapper -match '#include\s*<__clang_hip_cmath\.h>')
          Write-Host "Remaining forward declares: $remainingForward (should be 0)"
          Write-Host "hip_cmath included: $hasCmath (should be True)"

          $verifyComplex = Get-Content $complexHeader -Raw
          $hasBuiltin = ($verifyComplex -match '__builtin_isnan')
          Write-Host "complex_builtins patched: $hasBuiltin (should be True)"

      - name: Clone bonsai2 branch
        shell: bash
        run: |
          git clone --depth 1 -b bonsai2 https://github.com/sudoingX/llama.cpp.git
          cd llama.cpp
          git log -1 --oneline

      - name: Get commit hash
        id: get_commit
        shell: bash
        run: |
          cd llama.cpp
          HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$HASH" >> $GITHUB_OUTPUT
          echo "Current commit: $HASH"

      - name: Apply Windows compile patch
        shell: bash
        run: |
          cd llama.cpp
          HIP_HEADER="ggml-cuda/vendors/hip.h"
          if [ -f "$HIP_HEADER" ]; then
            if ! grep -q "#include <algorithm>" "$HIP_HEADER"; then
              sed -i '1i #include <algorithm>\nusing std::min; using std::max;' "$HIP_HEADER"
            fi
          fi

      - name: Configure CMake
        shell: powershell
        run: |
          cd llama.cpp
          $hipPath = $env:HIP_PATH
          $hipBin = $env:HIP_BIN
          $env:PATH = "$hipBin;$env:PATH"

          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_HIP=ON `
            -DAMDGPU_TARGETS=gfx1030 `
            -DCMAKE_C_COMPILER="$hipBin\clang.exe" `
            -DCMAKE_CXX_COMPILER="$hipBin\clang++.exe" `
            -DCMAKE_HIP_COMPILER="$hipBin\clang++.exe" `
            -DGGML_CUDA_BATCH_INVARIANT=ON `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF

      - name: Build
        shell: powershell
        timeout-minutes: 90
        run: |
          cd llama.cpp
          $env:PATH = "$($env:HIP_BIN);$env:PATH"
          cmake --build build --target llama-server llama-cli -j $env:NUMBER_OF_PROCESSORS
          Get-ChildItem build\bin\ | Format-Table Name, Length

      - name: Collect artifacts
        shell: powershell
        run: |
          $hash = "${{ steps.get_commit.outputs.COMMIT_HASH }}"
          $date = Get-Date -Format 'yyyyMMdd'
          $hipPath = $env:HIP_PATH
          mkdir output

          copy llama.cpp\build\bin\llama-server.exe output\
          copy llama.cpp\build\bin\llama-cli.exe output\

          $dllNames = @(
            "amdhip64*.dll", "rocblas*.dll", "hipblas*.dll", "rocsolver*.dll",
            "rocsparse*.dll", "hipfft*.dll", "rccl*.dll", "hiprand*.dll",
            "rocrand*.dll", "hipcub*.dll", "roctracer64*.dll"
          )
          foreach ($pattern in $dllNames) {
            $found = Get-ChildItem -Path $hipPath -Recurse -Filter $pattern -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { copy $found.FullName output\ }
          }

          @"
          Branch: bonsai2 (sudoingX/llama.cpp)
          Commit: $hash
          Build Date: $date
          Target GPU: gfx1030 (RX 6800 XT)
          HIP SDK Path: $hipPath
          Features: PQ2_0 support + MTP Hadamard fix + PTQ1_0 MMV kernel
          "@ | Out-File output\BUILD_INFO.txt -Encoding UTF8

          Compress-Archive -Path output\* -DestinationPath "bonsai2-win-gfx1030-$hash-$date.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bonsai2-win-gfx1030-${{ steps.get_commit.outputs.COMMIT_HASH }}
          path: bonsai2-win-gfx1030-*.zip
          retention-days: 30

      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bonsai2-win-gfx1030-${{ steps.get_commit.outputs.COMMIT_HASH }}
          name: "Bonsai2 MTP Windows gfx1030 - ${{ steps.get_commit.outputs.COMMIT_HASH }}"
          body: |
            Built from `sudoingX/llama.cpp` bonsai2 branch.
            - Commit: `${{ steps.get_commit.outputs.COMMIT_HASH }}`
            - Target GPU: gfx1030 (RX 6800 XT)
          files: bonsai2-win-gfx1030-*.zip
          generate_release_notes: false
