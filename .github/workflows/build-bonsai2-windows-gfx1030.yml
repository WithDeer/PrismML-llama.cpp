name: Build Bonsai2 MTP for Windows gfx1030

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ============================================================
      # 1. Install Ninja
      # ============================================================
      - name: Install Ninja
        shell: powershell
        run: |
          choco install ninja -y
          refreshenv
          ninja --version

      # ============================================================
      # 2. Cache HIP SDK installation
      # ============================================================
      - name: Cache HIP SDK
        uses: actions/cache@v4
        id: cache-hip
        with:
          path: C:\Program Files\AMD\ROCm
          key: hip-sdk-7.2-${{ runner.os }}-v5
          restore-keys: |
            hip-sdk-7.2-${{ runner.os }}-

      # ============================================================
      # 3. Download HIP SDK (if not cached)
      # ============================================================
      - name: Download HIP SDK
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: powershell
        timeout-minutes: 30
        run: |
          $url = "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-26.Q3-Win11-For-HIP.exe"
          $outFile = "$env:TEMP\HIP-SDK.exe"
          Write-Host "Downloading HIP SDK from: $url"
          curl.exe -L --fail --retry 3 --retry-delay 5 -o "$outFile" "$url"
          $size = (Get-Item $outFile).Length
          Write-Host "Downloaded size: $size bytes ($([math]::Round($size/1MB, 2)) MB)"
          if ($size -lt 100MB) { Write-Error "HIP SDK download incomplete."; exit 1 }

      # ============================================================
      # 4. Install HIP SDK Silently (if not cached)
      # ============================================================
      - name: Install HIP SDK Silently
        if: steps.cache-hip.outputs.cache-hit != 'true'
        shell: powershell
        timeout-minutes: 30
        run: |
          $installer = "$env:TEMP\HIP-SDK.exe"
          $logFile = "$env:TEMP\hip-install.log"
          Write-Host "Starting silent HIP SDK installation..."
          $proc = Start-Process -FilePath $installer -ArgumentList "-install", "-log", $logFile -NoNewWindow -PassThru
          $completed = $proc.WaitForExit(1500000)
          if (-not $completed) {
            Write-Error "HIP SDK installation timed out."
            $proc.Kill()
            exit 1
          }
          Write-Host "Installation process exited."
          if (Test-Path $logFile) { Get-Content $logFile -Tail 20 }

          $rocmBase = "C:\Program Files\AMD\ROCm"
          $hipPath = Get-ChildItem $rocmBase -Directory -ErrorAction SilentlyContinue |
                     Sort-Object Name -Descending | Select-Object -First 1
          if (-not $hipPath) { Write-Error "No ROCm directory found"; exit 1 }
          $hipPath = $hipPath.FullName
          Write-Host "Detected HIP SDK path: $hipPath"

          $clang = Get-ChildItem -Path $hipPath -Recurse -Filter "clang.exe" -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          $amdhip = Get-ChildItem -Path $hipPath -Recurse -Filter "amdhip64*.dll" -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $clang) { Write-Error "clang.exe not found"; exit 1 }
          if (-not $amdhip) { Write-Error "amdhip64*.dll not found"; exit 1 }

          echo "HIP_PATH=$hipPath" >> $env:GITHUB_ENV
          echo "HIP_BIN=$($clang.Directory.FullName)" >> $env:GITHUB_ENV
          echo "$($clang.Directory.FullName)" >> $env:GITHUB_PATH

      # ============================================================
      # 5. Set HIP Environment Variables (also for cached case)
      # ============================================================
      - name: Set HIP Environment
        shell: powershell
        run: |
          if (-not $env:HIP_PATH) {
            $rocmBase = "C:\Program Files\AMD\ROCm"
            $hipPath = Get-ChildItem $rocmBase -Directory -ErrorAction SilentlyContinue |
                       Sort-Object Name -Descending | Select-Object -First 1
            $hipPath = $hipPath.FullName
            $clang = Get-ChildItem -Path $hipPath -Recurse -Filter "clang.exe" -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            $hipBin = $clang.Directory.FullName
            echo "HIP_PATH=$hipPath" >> $env:GITHUB_ENV
            echo "HIP_BIN=$hipBin" >> $env:GITHUB_ENV
            echo "$hipBin" >> $env:GITHUB_PATH
          }
          Write-Host "HIP_PATH = $env:HIP_PATH"
          Write-Host "HIP_BIN  = $env:HIP_BIN"

      # ============================================================
      # 6. Patch clang HIP math headers to skip conflicting includes
      # ============================================================
      - name: Patch clang HIP math headers
        shell: powershell
        run: |
          $hipPath = $env:HIP_PATH
          Write-Host "HIP_PATH = $hipPath"

          # Locate __clang_hip_runtime_wrapper.h
          $wrapper = Get-ChildItem -Path $hipPath -Recurse -Filter "__clang_hip_runtime_wrapper.h" -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if (-not $wrapper) {
            Write-Error "__clang_hip_runtime_wrapper.h not found under $hipPath"
            exit 1
          }
          $wrapperPath = $wrapper.FullName
          Write-Host "Found wrapper: $wrapperPath"

          # Backup once
          if (-not (Test-Path "$wrapperPath.bak")) {
            Copy-Item $wrapperPath "$wrapperPath.bak" -Force
            Write-Host "Backup created: $wrapperPath.bak"
          } else {
            Write-Host "Backup already exists, restoring from backup before re-patching"
            Copy-Item "$wrapperPath.bak" $wrapperPath -Force
          }

          # Read all lines
          $lines = Get-Content $wrapperPath
          $newLines = @()
          $patched = 0

          foreach ($line in $lines) {
            # Comment out the two conflicting includes
            if ($line -match '^\s*#include\s*<__clang_cuda_math_forward_declares\.h>') {
              $newLines += "// PATCHED: $line"
              Write-Host "Commented out: $line"
              $patched++
            }
            elseif ($line -match '^\s*#include\s*<__clang_hip_cmath\.h>') {
              $newLines += "// PATCHED: $line"
              Write-Host "Commented out: $line"
              $patched++
            }
            else {
              $newLines += $line
            }
          }

          if ($patched -eq 0) {
            Write-Warning "No conflicting includes found. The header may have already been patched or layout changed."
          } else {
            Write-Host "Patched $patched conflicting include(s)."
          }

          # Write back
          $newLines | Set-Content -Path $wrapperPath -Encoding UTF8
          Write-Host "Wrapper header patched successfully."

          # Verify
          $verify = Get-Content $wrapperPath -Raw
          $remaining = ([regex]::Matches($verify, '^\s*#include\s*<__clang_(cuda_math_forward_declares|hip_cmath)\.h>', 'Multiline')).Count
          if ($remaining -eq 0) {
            Write-Host "Verification: no conflicting includes remain."
          } else {
            Write-Warning "Verification: $remaining conflicting include(s) still present."
          }

      # ============================================================
      # 7. Clone bonsai2 branch
      # ============================================================
      - name: Clone bonsai2 branch
        shell: bash
        run: |
          git clone --depth 1 -b bonsai2 https://github.com/sudoingX/llama.cpp.git
          cd llama.cpp
          git log -1 --oneline

      # ============================================================
      # 8. Get commit hash
      # ============================================================
      - name: Get commit hash
        id: get_commit
        shell: bash
        run: |
          cd llama.cpp
          HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$HASH" >> $GITHUB_OUTPUT
          echo "Current commit: $HASH"

      # ============================================================
      # 9. Apply Windows compile patch
      # ============================================================
      - name: Apply Windows compile patch
        shell: bash
        run: |
          cd llama.cpp
          HIP_HEADER="ggml-cuda/vendors/hip.h"
          if [ -f "$HIP_HEADER" ]; then
            if ! grep -q "#include <algorithm>" "$HIP_HEADER"; then
              echo "Adding algorithm header to $HIP_HEADER"
              sed -i '1i #include <algorithm>\nusing std::min; using std::max;' "$HIP_HEADER"
            fi
          fi

      # ============================================================
      # 10. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: powershell
        run: |
          cd llama.cpp
          $hipPath = $env:HIP_PATH
          $hipBin = $env:HIP_BIN
          $env:PATH = "$hipBin;$env:PATH"

          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_HIP=ON `
            -DAMDGPU_TARGETS=gfx1030 `
            -DCMAKE_C_COMPILER="$hipBin\clang.exe" `
            -DCMAKE_CXX_COMPILER="$hipBin\clang++.exe" `
            -DCMAKE_HIP_COMPILER="$hipBin\clang++.exe" `
            -DGGML_CUDA_BATCH_INVARIANT=ON `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF

      # ============================================================
      # 11. Build
      # ============================================================
      - name: Build
        shell: powershell
        timeout-minutes: 90
        run: |
          cd llama.cpp
          $env:PATH = "$($env:HIP_BIN);$env:PATH"
          cmake --build build --target llama-server llama-cli -j $env:NUMBER_OF_PROCESSORS
          Write-Host "Build completed. Artifacts:"
          Get-ChildItem build\bin\ | Format-Table Name, Length

      # ============================================================
      # 12. Collect artifacts
      # ============================================================
      - name: Collect artifacts
        shell: powershell
        run: |
          $hash = "${{ steps.get_commit.outputs.COMMIT_HASH }}"
          $date = Get-Date -Format 'yyyyMMdd'
          $hipPath = $env:HIP_PATH
          mkdir output

          copy llama.cpp\build\bin\llama-server.exe output\
          copy llama.cpp\build\bin\llama-cli.exe output\

          $dllNames = @(
            "amdhip64*.dll", "rocblas*.dll", "hipblas*.dll", "rocsolver*.dll",
            "rocsparse*.dll", "hipfft*.dll", "rccl*.dll", "hiprand*.dll",
            "rocrand*.dll", "hipcub*.dll", "roctracer64*.dll"
          )
          foreach ($pattern in $dllNames) {
            $found = Get-ChildItem -Path $hipPath -Recurse -Filter $pattern -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) {
              copy $found.FullName output\
              Write-Host "Copied $($found.Name)"
            } else {
              Write-Host "Skipped missing pattern $pattern"
            }
          }

          @"
          Branch: bonsai2 (sudoingX/llama.cpp)
          Commit: $hash
          Build Date: $date
          Target GPU: gfx1030 (RX 6800 XT)
          HIP SDK Path: $hipPath
          Features: PQ2_0 support + MTP Hadamard fix + PTQ1_0 MMV kernel
          "@ | Out-File output\BUILD_INFO.txt -Encoding UTF8

          Compress-Archive -Path output\* -DestinationPath "bonsai2-win-gfx1030-$hash-$date.zip"

          Write-Host "Packaging completed."
          Get-ChildItem *.zip | Format-Table Name, Length

      # ============================================================
      # 13. Upload artifacts
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bonsai2-win-gfx1030-${{ steps.get_commit.outputs.COMMIT_HASH }}
          path: bonsai2-win-gfx1030-*.zip
          retention-days: 30

      # ============================================================
      # 14. Create Release (optional)
      # ============================================================
      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bonsai2-win-gfx1030-${{ steps.get_commit.outputs.COMMIT_HASH }}
          name: "Bonsai2 MTP Windows gfx1030 - ${{ steps.get_commit.outputs.COMMIT_HASH }}"
          body: |
            Built from `sudoingX/llama.cpp` bonsai2 branch.
            - **Commit**: `${{ steps.get_commit.outputs.COMMIT_HASH }}`
            - **Target GPU**: gfx1030 (RX 6800 XT)
            - **Features**: PQ2_0 support + MTP Hadamard fix + PTQ1_0 MMV kernel
            - **Build**: ${{ github.run_id }}
          files: bonsai2-win-gfx1030-*.zip
          generate_release_notes: false
