name: Build Bonsai2 MTP for Windows gfx1030

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ============================================================
      # 1. Install Ninja
      # ============================================================
      - name: Install Ninja
        shell: powershell
        run: |
          choco install ninja -y
          refreshenv
          ninja --version

      # ============================================================
      # 2. Download HIP SDK with curl.exe
      # ============================================================
      - name: Download HIP SDK
        shell: powershell
        timeout-minutes: 30
        run: |
          $url = "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-26.Q3-Win11-For-HIP.exe"
          $outFile = "$env:TEMP\HIP-SDK.exe"

          Write-Host "Downloading HIP SDK from: $url"
          curl.exe -L --fail --retry 3 --retry-delay 5 -o "$outFile" "$url"

          $size = (Get-Item $outFile).Length
          Write-Host "Downloaded size: $size bytes ($([math]::Round($size/1MB, 2)) MB)"
          if ($size -lt 100MB) {
            Write-Error "HIP SDK download incomplete, size less than 100MB."
            exit 1
          }

          $hash = (Get-FileHash $outFile -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"

      # ============================================================
      # 3. Install HIP SDK with timeout detection
      # ============================================================
      - name: Install HIP SDK
        shell: powershell
        timeout-minutes: 45
        run: |
          $installer = "$env:TEMP\HIP-SDK.exe"
          $timeoutMinutes = 30

          $startTime = Get-Date
          $deadline = $startTime.AddMinutes($timeoutMinutes)

          Write-Host "Starting HIP SDK installation. Timeout: $timeoutMinutes minutes"

          $proc = Start-Process -FilePath $installer `
            -ArgumentList "/S", "/v/qn", "/norestart" `
            -PassThru -NoNewWindow

          Write-Host "Installer PID: $($proc.Id)"

          $killed = $false
          while ($true) {
            Start-Sleep -Seconds 15

            $proc.Refresh()
            if ($proc.HasExited) {
              break
            }

            $elapsed = ((Get-Date) - $startTime).TotalMinutes
            Write-Host ("Elapsed: {0:N1} minutes" -f $elapsed)

            if ((Get-Date) -gt $deadline) {
              Write-Host "Installation exceeded $timeoutMinutes minutes. Killing process."
              try {
                $proc.Kill()
                Start-Sleep -Seconds 5
                Get-Process -Name "HIP-SDK", "amd*", "Install*" -ErrorAction SilentlyContinue |
                  Stop-Process -Force -ErrorAction SilentlyContinue
              } catch {
                Write-Host "Error killing process: $_"
              }
              $killed = $true
              break
            }
          }

          if ($killed) {
            Write-Error "HIP SDK installation hung. Consider local build or self-hosted runner."
            exit 1
          }

          $exitCode = $proc.ExitCode
          Write-Host "Installer exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Warning "Installer returned non-zero exit code: $exitCode. Checking files..."
          }

          $hipPath = "C:\Program Files\AMD\ROCm\7.1"
          $requiredPaths = @(
            "$hipPath\bin\amdhip64.dll",
            "$hipPath\bin\clang.exe",
            "$hipPath\include\hip\hip_runtime.h"
          )

          $missing = @()
          foreach ($p in $requiredPaths) {
            if (Test-Path $p) {
              Write-Host "OK: $p"
            } else {
              Write-Host "MISSING: $p"
              $missing += $p
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "HIP SDK installation incomplete. Missing: $($missing -join ', ')"
            exit 1
          }

          Write-Host "HIP SDK installation verified."

      # ============================================================
      # 4. Set HIP environment variables
      # ============================================================
      - name: Set HIP environment
        shell: powershell
        run: |
          $hipPath = "C:\Program Files\AMD\ROCm\7.1"
          echo "HIP_PATH=$hipPath" >> $env:GITHUB_ENV
          echo "$hipPath\bin" >> $env:GITHUB_PATH
          Write-Host "HIP_PATH set to: $hipPath"

      # ============================================================
      # 5. Clone bonsai2 branch
      # ============================================================
      - name: Clone bonsai2 branch
        shell: bash
        run: |
          git clone --depth 1 -b bonsai2 https://github.com/sudoingX/llama.cpp.git
          cd llama.cpp
          git log -1 --oneline

      # ============================================================
      # 6. Get commit hash
      # ============================================================
      - name: Get commit hash
        id: get_commit
        shell: bash
        run: |
          cd llama.cpp
          HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$HASH" >> $GITHUB_OUTPUT
          echo "Current commit: $HASH"

      # ============================================================
      # 7. Apply Windows compile patch
      # ============================================================
      - name: Apply Windows compile patch
        shell: bash
        run: |
          cd llama.cpp
          HIP_HEADER="ggml-cuda/vendors/hip.h"
          if [ -f "$HIP_HEADER" ]; then
            if ! grep -q "#include <algorithm>" "$HIP_HEADER"; then
              echo "Adding algorithm header to $HIP_HEADER"
              sed -i '1i #include <algorithm>\nusing std::min; using std::max;' "$HIP_HEADER"
            else
              echo "$HIP_HEADER already contains algorithm header"
            fi
          else
            echo "$HIP_HEADER not found, skipping patch"
          fi

      # ============================================================
      # 8. Configure CMake
      # ============================================================
      - name: Configure CMake
        shell: powershell
        run: |
          cd llama.cpp
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_HIP=ON `
            -DAMDGPU_TARGETS=gfx1030 `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DGGML_CUDA_BATCH_INVARIANT=ON `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF

      # ============================================================
      # 9. Build
      # ============================================================
      - name: Build
        shell: powershell
        timeout-minutes: 60
        run: |
          cd llama.cpp
          cmake --build build --target llama-server llama-cli -j $env:NUMBER_OF_PROCESSORS

          Write-Host "Build completed. Artifacts:"
          Get-ChildItem build\bin\ | Format-Table Name, Length

      # ============================================================
      # 10. Collect artifacts
      # ============================================================
      - name: Collect artifacts
        shell: powershell
        run: |
          $hash = "${{ steps.get_commit.outputs.COMMIT_HASH }}"
          $date = Get-Date -Format 'yyyyMMdd'
          mkdir output

          copy llama.cpp\build\bin\llama-server.exe output\
          copy llama.cpp\build\bin\llama-cli.exe output\

          $hipBin = "C:\Program Files\AMD\ROCm\7.1\bin"
          $dlls = @(
            "amdhip64.dll", "rocblas.dll", "hipblas.dll", "rocsolver.dll",
            "rocsparse.dll", "hipfft.dll", "rccl.dll", "hiprand.dll",
            "rocrand.dll", "hipcub.dll", "roctracer64.dll"
          )
          foreach ($dll in $dlls) {
            $src = Join-Path $hipBin $dll
            if (Test-Path $src) {
              copy $src output\
              Write-Host "Copied $dll"
            } else {
              Write-Host "Skipped missing $dll"
            }
          }

          @"
          Branch: bonsai2 (sudoingX/llama.cpp)
          Commit: $hash
          Build Date: $date
          Target GPU: gfx1030 (RX 6800 XT)
          Features: PQ2_0 support + MTP Hadamard fix + PTQ1_0 MMV kernel
          "@ | Out-File output\BUILD_INFO.txt -Encoding UTF8

          Compress-Archive -Path output\* -DestinationPath "bonsai2-win-gfx1030-$hash-$date.zip"

          Write-Host "Packaging completed."
          Get-ChildItem *.zip | Format-Table Name, Length

      # ============================================================
      # 11. Upload artifacts
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bonsai2-win-gfx1030-${{ steps.get_commit.outputs.COMMIT_HASH }}
          path: bonsai2-win-gfx1030-*.zip
          retention-days: 30

      # ============================================================
      # 12. Create Release (optional)
      # ============================================================
      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bonsai2-win-gfx1030-${{ steps.get_commit.outputs.COMMIT_HASH }}
          name: "Bonsai2 MTP Windows gfx1030 - ${{ steps.get_commit.outputs.COMMIT_HASH }}"
          body: |
            Built from `sudoingX/llama.cpp` bonsai2 branch.

            - **Commit**: `${{ steps.get_commit.outputs.COMMIT_HASH }}`
            - **Target GPU**: gfx1030 (RX 6800 XT)
            - **Features**: PQ2_0 support + MTP Hadamard fix + PTQ1_0 MMV kernel
            - **Build**: ${{ github.run_id }}

            ### Run example
            ```powershell
            .\llama-server.exe -m "D:\ai-soft\AI-model\Ternary-Bonsai-2-27B-PQ2_0-MTP-Q8_0.gguf" `
              --mmproj "D:\ai-soft\AI-model\Ternary-Bonsai-27B-mmproj-Q8_0.gguf" `
              -ngl 99 -c 65536 -fa on -ctk q8_0 -ctv q8_0 `
              --load-mode none -np 1 --jinja `
              --spec-type draft-mtp --spec-draft-n-max 1 --port 8080
