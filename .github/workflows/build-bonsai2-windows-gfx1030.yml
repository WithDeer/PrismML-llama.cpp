name: Build Bonsai2 MTP for Windows gfx1030

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建 GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [ main ]
  schedule:
    # 每周一 UTC 02:00 自动检查 sudoingX/llama.cpp 更新
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ============================================================
      # 1. 安装 Ninja 构建工具
      # ============================================================
      - name: 安装 Ninja
        shell: powershell
        run: |
          choco install ninja -y
          refreshenv
          # 验证 ninja 可用
          ninja --version

      # ============================================================
      # 2. 下载 HIP SDK 安装程序
      # ============================================================
      - name: 下载 HIP SDK
        shell: powershell
        timeout-minutes: 20
        run: |
          # 请替换为 AMD 官网当前最新的 HIP SDK for Windows 下载地址
          # 建议将安装程序上传到本仓库 Release（tag: hip-sdk）后使用 Release Asset URL
          $url = "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-26.Q3-Win11-For-HIP.exe"
          $outFile = "$env:TEMP\HIP-SDK.exe"

          Write-Host "开始下载 HIP SDK: $url"
          Invoke-WebRequest -Uri $url -OutFile $outFile -UseBasicParsing

          # 验证文件大小
          $size = (Get-Item $outFile).Length
          Write-Host "下载文件大小: $size bytes ($([math]::Round($size/1MB, 2)) MB)"

          if ($size -lt 100MB) {
            Write-Error "HIP SDK 下载不完整，文件大小异常（小于 100MB）。"
            exit 1
          }

          # 输出 SHA256 供核对
          $hash = (Get-FileHash $outFile -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"

      # ============================================================
      # 3. 安装 HIP SDK（含主动超时检测与安装验证）
      # ============================================================
      - name: 安装 HIP SDK
        shell: powershell
        timeout-minutes: 45
        run: |
          $installer = "$env:TEMP\HIP-SDK.exe"
          $timeoutMinutes = 30
          $deadline = (Get-Date).AddMinutes($timeoutMinutes)

          Write-Host "启动 HIP SDK 安装，主动超时阈值: $timeoutMinutes 分钟"

          # 启动安装进程，不等待
          $proc = Start-Process -FilePath $installer `
            -ArgumentList "/S", "/v/qn", "/norestart" `
            -PassThru -NoNewWindow

          Write-Host "安装进程 PID: $($proc.Id)"

          # 轮询等待，同时检测超时
          $killed = $false
          while (-not $proc.HasExited) {
            Start-Sleep -Seconds 15
            $elapsed = ((Get-Date) - $proc.StartTime).TotalMinutes
            Write-Host ("已等待 {0:N1} 分钟，进程状态: {1}" -f $elapsed, $proc.ProcessName)

            if ((Get-Date) -gt $deadline) {
              Write-Host "❌ 安装超过 $timeoutMinutes 分钟仍未完成，判定为卡死，强制终止。"
              try {
                $proc.Kill()
                Start-Sleep -Seconds 5
                # 清理可能残留的子进程
                Get-Process -Name "HIP-SDK", "amd*", "Install*" -ErrorAction SilentlyContinue |
                  Stop-Process -Force -ErrorAction SilentlyContinue
              } catch {
                Write-Host "终止进程时出错: $_"
              }
              $killed = $true
              break
            }
          }

          if ($killed) {
            Write-Error "HIP SDK 安装卡死，已强制终止。建议改用本地编译或自托管 Runner。"
            exit 1
          }

          $exitCode = $proc.ExitCode
          Write-Host "安装进程退出码: $exitCode"

          if ($exitCode -ne 0) {
            Write-Warning "安装程序返回非零退出码: $exitCode，继续检查关键文件是否存在..."
          }

          # 验证安装结果：检查关键目录和文件
          $hipPath = "C:\Program Files\AMD\ROCm\7.1"
          $requiredPaths = @(
            "$hipPath\bin\amdhip64.dll",
            "$hipPath\bin\clang.exe",
            "$hipPath\include\hip\hip_runtime.h"
          )

          $missing = @()
          foreach ($p in $requiredPaths) {
            if (Test-Path $p) {
              Write-Host "✅ 存在: $p"
            } else {
              Write-Host "❌ 缺失: $p"
              $missing += $p
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "HIP SDK 安装不完整，缺失关键文件: $($missing -join ', ')"
            exit 1
          }

          Write-Host "✅ HIP SDK 安装验证通过。"

      # ============================================================
      # 4. 设置 HIP 环境变量
      # ============================================================
      - name: 设置 HIP 环境变量
        shell: powershell
        run: |
          $hipPath = "C:\Program Files\AMD\ROCm\7.1"
          echo "HIP_PATH=$hipPath" >> $env:GITHUB_ENV
          echo "$hipPath\bin" >> $env:GITHUB_PATH
          Write-Host "HIP_PATH 已设置为: $hipPath"

      # ============================================================
      # 5. 克隆 sudoingX/llama.cpp 的 bonsai2 分支
      # ============================================================
      - name: 克隆 bonsai2 分支
        shell: bash
        run: |
          git clone --depth 1 -b bonsai2 https://github.com/sudoingX/llama.cpp.git
          cd llama.cpp
          git log -1 --oneline

      # ============================================================
      # 6. 记录 commit hash 用于版本标识
      # ============================================================
      - name: 获取 commit hash
        id: get_commit
        shell: bash
        run: |
          cd llama.cpp
          HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$HASH" >> $GITHUB_OUTPUT
          echo "当前 commit: $HASH"

      # ============================================================
      # 7. 应用 Windows 编译补丁（如遇编译错误可启用）
      # ============================================================
      - name: 应用 Windows 编译补丁
        shell: bash
        run: |
          cd llama.cpp
          # 修复 min/max 命名冲突（如果 hip.h 存在且未包含 algorithm）
          HIP_HEADER="ggml-cuda/vendors/hip.h"
          if [ -f "$HIP_HEADER" ]; then
            if ! grep -q "#include <algorithm>" "$HIP_HEADER"; then
              echo "为 $HIP_HEADER 添加 algorithm 头文件与 using 声明"
              sed -i '1i #include <algorithm>\nusing std::min; using std::max;' "$HIP_HEADER"
            else
              echo "$HIP_HEADER 已包含 algorithm 头文件，跳过"
            fi
          else
            echo "未找到 $HIP_HEADER，跳过该补丁"
          fi

      # ============================================================
      # 8. 配置 CMake
      # ============================================================
      - name: 配置 CMake
        shell: powershell
        run: |
          cd llama.cpp
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_HIP=ON `
            -DAMDGPU_TARGETS=gfx1030 `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DGGML_CUDA_BATCH_INVARIANT=ON `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF

      # ============================================================
      # 9. 编译
      # ============================================================
      - name: 编译
        shell: powershell
        timeout-minutes: 60
        run: |
          cd llama.cpp
          cmake --build build --target llama-server llama-cli -j $env:NUMBER_OF_PROCESSORS

          Write-Host "=== 编译完成，产物列表 ==="
          Get-ChildItem build\bin\ | Format-Table Name, Length

      # ============================================================
      # 10. 收集产物
      # ============================================================
      - name: 收集产物
        shell: powershell
        run: |
          $hash = "${{ steps.get_commit.outputs.COMMIT_HASH }}"
          $date = Get-Date -Format 'yyyyMMdd'
          mkdir output

          copy llama.cpp\build\bin\llama-server.exe output\
          copy llama.cpp\build\bin\llama-cli.exe output\

          # 复制 HIP SDK 关键 DLL
          $hipBin = "C:\Program Files\AMD\ROCm\7.1\bin"
          $dlls = @(
            "amdhip64.dll", "rocblas.dll", "hipblas.dll", "rocsolver.dll",
            "rocsparse.dll", "hipfft.dll", "rccl.dll", "hiprand.dll",
            "rocrand.dll", "hipcub.dll", "roctracer64.dll"
          )
          foreach ($dll in $dlls) {
            $src = Join-Path $hipBin $dll
            if (Test-Path $src) {
              copy $src output\
              Write-Host "✅ 复制 $dll"
            } else {
              Write-Host "⚠️ 跳过不存在的 $dll"
            }
          }

          # 写入构建信息
          @"
          Branch: bonsai2 (sudoingX/llama.cpp)
          Commit: $hash
          Build Date: $date
          Target GPU: gfx1030 (RX 6800 XT)
          Features: PQ2_0 support + MTP Hadamard fix + PTQ1_0 MMV kernel
          "@ | Out-File output\BUILD_INFO.txt -Encoding UTF8

          Compress-Archive -Path output\* -DestinationPath "bonsai2-win-gfx1030-$hash-$date.zip"

          Write-Host "=== 打包完成 ==="
          Get-ChildItem *.zip | Format-Table Name, Length

      # ============================================================
      # 11. 上传产物
      # ============================================================
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bonsai2-win-gfx1030-${{ steps.get_commit.outputs.COMMIT_HASH }}
          path: bonsai2-win-gfx1030-*.zip
          retention-days: 30

      # ============================================================
      # 12. 创建 Release（可选）
      # ============================================================
      - name: 创建 Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bonsai2-win-gfx1030-${{ steps.get_commit.outputs.COMMIT_HASH }}
          name: "Bonsai2 MTP Windows gfx1030 - ${{ steps.get_commit.outputs.COMMIT_HASH }}"
          body: |
            基于 `sudoingX/llama.cpp` 的 `bonsai2` 分支构建。

            - **Commit**: `${{ steps.get_commit.outputs.COMMIT_HASH }}`
            - **目标架构**: gfx1030 (RX 6800 XT)
            - **特性**: PQ2_0 解析 + MTP Hadamard 修复 + PTQ1_0 MMV 内核
            - **构建时间**: ${{ github.run_id }}

            ### 运行示例
            ```powershell
            .\llama-server.exe -m "D:\ai-soft\AI-model\Ternary-Bonsai-2-27B-PQ2_0-MTP-Q8_0.gguf" `
              --mmproj "D:\ai-soft\AI-model\Ternary-Bonsai-27B-mmproj-Q8_0.gguf" `
              -ngl 99 -c 65536 -fa on -ctk q8_0 -ctv q8_0 `
              --load-mode none -np 1 --jinja `
              --spec-type draft-mtp --spec-draft-n-max 1 --port 8080
